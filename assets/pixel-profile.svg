<svg width="760" height="600" viewBox="0 0 760 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kangjia Gao profile card</title>
  <desc id="desc">Kangjia Gao, undergraduate student at Hebei University. Contact: kkkzbh@stumail.hbu.edu.cn, 19033190031.</desc>
  <metadata>Tux was created by Larry Ewing in GIMP, re-illustrated as a vector by Garrett LeSage, and refined by IFo Hancroft. Source: https://commons.wikimedia.org/wiki/File:Tux.svg</metadata>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 28px; font-weight: 760; letter-spacing: 0; fill: #0f172a; }
    .section { font-size: 16px; font-weight: 760; letter-spacing: 0; fill: #0f172a; }
    .label { font-size: 13px; letter-spacing: 0; fill: #64748b; }
    .body { font-size: 14px; letter-spacing: 0; fill: #334155; }
    .contact { font-size: 15px; letter-spacing: 0; fill: #334155; }
    .strong { font-size: 16px; font-weight: 720; letter-spacing: 0; fill: #0f172a; }
    .cyan { fill: #0891b2; }
    .green { fill: #059669; }
    .amber { fill: #d97706; }
    .frame { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .inner { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .divider { stroke: #cbd5e1; stroke-width: 1; }
    .pixel { shape-rendering: crispEdges; }
    .icon { fill: none; stroke: #0891b2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .solid-icon { fill: #0891b2; }
    .sticker { fill: #f8fafc; stroke-width: 1.5; }
    .sticker-text { font-size: 11px; font-weight: 760; letter-spacing: 0; }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: .25; }
    }

    @keyframes pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }

    @keyframes scan {
      from { transform: translateX(-42px); }
      to { transform: translateX(802px); }
    }

    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .pulse-a { animation: pulse 1.6s ease-in-out infinite; }
    .pulse-b { animation: pulse 2.2s ease-in-out infinite; animation-delay: .25s; }
    .pulse-c { animation: pulse 1.9s ease-in-out infinite; animation-delay: .55s; }
    .scan { animation: scan 6s linear infinite; }
  </style>

  <defs>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#06b6d4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="744" height="584" rx="0" class="frame"/>
  <rect x="20" y="20" width="720" height="560" rx="0" class="inner"/>

  <g opacity=".52">
