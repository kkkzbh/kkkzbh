  <g class="icon" transform="translate(470.5 119) scale(.72)">
    <path d="M5 4h4l2 5-3 2a14 14 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2"/>
  </g>
  <text x="506" y="134" class="mono contact">19033190031</text>

  <path d="M36 164H724" class="divider"/>

  <text x="52" y="206" class="mono section">ABOUT</text>
  <g class="pixel">
    <rect x="116" y="195" width="8" height="8" class="cyan pulse-a"/>
    <rect x="132" y="195" width="8" height="8" class="green pulse-b"/>
    <rect x="148" y="195" width="8" height="8" class="amber pulse-c"/>
  </g>

  <text x="52" y="244" class="mono body">I have spent a lot of time studying C++, both its syntax and modern</text>
  <text x="52" y="270" class="mono body">language features, and I am also deeply interested in computer</text>
  <text x="52" y="296" class="mono body">systems. In C++, I have implemented an operating system kernel,</text>
  <text x="52" y="322" class="mono body">a compiler, and a TCP stack. I have also implemented an Agent system.</text>

  <text x="52" y="370" class="mono body">Linux is my daily operating system, and I use Fedora with KDE. I find</text>
  <text x="52" y="396" class="mono body">Linux much more comfortable than Windows, and I recommend every</text>
  <text x="52" y="422" class="mono body">computer science student try a physical Linux system at least once.</text>
  <text x="52" y="448" class="mono body">My personal recommendation is Fedora + KDE.</text>

  <text x="52" y="496" class="mono body">To me, sitting in front of a computer, exploring computer technology,</text>
  <text x="52" y="522" class="mono body">thinking through ideas, and doing research are all genuinely exciting.</text>
  <text x="52" y="548" class="mono body">You are very welcome to talk with me about computers.</text>

  <path d="M36 572H724" class="divider"/>
</svg>
