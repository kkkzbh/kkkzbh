      <circle cx="578" cy="315" r="7"/><circle cx="672" cy="315" r="7"/>
      <path d="M585 315h24m33 0h23M609 306h33v18h-33z"/>
      <text x="615" y="319" class="sticker-text" fill="#d97706" stroke="none">TCP</text>
    </g>
    </g>
    </g>

    <!-- RTX inference engine beside the third About paragraph -->
    <g transform="translate(5 205) scale(.36)">
      <g transform="rotate(4 70 870)" fill="none" stroke="#059669" stroke-width="1.8">
        <path d="M17 850h105v40H17zM9 856h8v28H9M28 890v7h65v-7M103 858h19"/>
        <circle cx="43" cy="870" r="13"/><circle cx="78" cy="870" r="13"/>
