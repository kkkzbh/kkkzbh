      <path d="M668 861c3-5 7-5 10 0m4 0c3-5 7-5 10 0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <path d="M669 875c7 7 15 7 22 0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <path d="M656 871c-14-8-22-4-18 4 3 6 12 7 20 6m46-10c14-8 22-4 18 4-3 6-12 7-20 6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
