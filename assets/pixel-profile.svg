    <g transform="rotate(-7 33 274)" fill="#0891b2">
      <text x="10" y="294" class="mono" font-size="52" font-weight="760">C</text>
      <text x="34" y="261" class="mono" font-size="18" font-weight="760">++</text>
    </g>
    <g transform="translate(170 65) scale(.75)">
