    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .divider { stroke: #cbd5e1; stroke-width: 1; }
    .pixel { shape-rendering: crispEdges; }
    .icon { fill: none; stroke: #0891b2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    @keyframes scan {
      from { transform: translateX(-42px); }
      to { transform: translateX(722px); }
    }

    .scan { animation: scan 6s linear infinite; }
  </style>

  <defs>
