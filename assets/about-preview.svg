<svg width="680" height="244" viewBox="0 0 680 244" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kangjia Gao profile card</title>
  <desc id="desc">Kangjia Gao, undergraduate student at Hebei University. Contact: kkkzbh@stumail.hbu.edu.cn, 19033190031.</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 28px; font-weight: 760; letter-spacing: 0; fill: #0f172a; }
    .body { font-size: 13px; letter-spacing: 0; fill: #334155; }
    .contact { font-size: 13px; letter-spacing: 0; fill: #334155; }
    .strong { font-size: 14px; font-weight: 720; letter-spacing: 0; fill: #0f172a; }
    .title { font-size: 15px; font-weight: 760; letter-spacing: 0; }
    .cyan { fill: #0891b2; }
    .green { fill: #059669; }
    .amber { fill: #d97706; }
    .frame { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
